name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript
        run: yarn typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Vitest
        run: yarn test:run

  build:
    name: Build (compile content)
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Compile .courses → artifacts
        run: yarn build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: content-artifacts
          path: artifacts/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel (approval)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "::error::VERCEL_ORG_ID secret is empty"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::VERCEL_PROJECT_ID secret is empty"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN secret is empty"; exit 1; }
          echo "VERCEL_ORG_ID length: ${#VERCEL_ORG_ID}"
          echo "VERCEL_PROJECT_ID length: ${#VERCEL_PROJECT_ID}"

      - name: Verify Vercel API access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          status=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")
          if [ "$status" != "200" ]; then
            echo "::error::Vercel API returned HTTP $status for project lookup."
            echo "Check VERCEL_TOKEN (full account token), VERCEL_ORG_ID (team_…), VERCEL_PROJECT_ID (prj_…)."
            echo "If secrets exist under Environment → Production, they override repository secrets."
            cat /tmp/vercel-project.json || true
            exit 1
          fi
          echo "Vercel project accessible."

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Drop env files from Vercel (GitHub is source of truth)
        run: rm -f .vercel/.env.preview.local .vercel/.env.production.local .vercel/.env.local .vercel/.env.development.local

      - name: Verify CORS_ORIGIN from GitHub
        env:
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          test -n "$CORS_ORIGIN" || {
            echo "::error::Set repository Variable CORS_ORIGIN to the FE origin (e.g. https://readystate-frontend-demo.vercel.app)"
            exit 1
          }
          echo "CORS_ORIGIN=$CORS_ORIGIN"

      - name: Verify Vercel link
        run: test -f .vercel/project.json

      - name: Build for Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          # Express reads process.env at runtime — pass via --env (not only build-time .env files)
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --env "CORS_ORIGIN=$CORS_ORIGIN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Summary
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
