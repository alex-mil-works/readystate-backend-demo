id: i01
kind: interview_phrasing
phase: phrasing
prompt: Зачем функции параметр типа и что делает constraint?
rubric: |-
  Ожидаемые пункты:
  - T связывает вход и выход
  - без этого остаётся any/unknown
  - extends ограничивает форму
  - это не runtime-проверка
sampleAnswer: Generic нужен, когда результат зависит от аргумента. first на
  массиве строк возвращает строку или undefined, на массиве уроков — урок.
  Constraint extends говорит, какие поля функция читает, и отсекает неподходящий
  аргумент на сборке, а не в браузере.
