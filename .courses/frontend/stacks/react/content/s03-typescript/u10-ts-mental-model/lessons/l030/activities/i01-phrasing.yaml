id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда вы пишете аннотацию сами, а когда оставляете вывод типов?
rubric: |-
  Ожидаемые пункты:
  - вывод для локальных значений и возврата, если он очевиден
  - аннотация на параметрах и публичном API
  - `let` расширяет литерал
  - пустой массив нужно аннотировать
sampleAnswer: Внутри функции я доверяю выводу. На параметре и на экспортируемой
  функции тип — это контракт, его пишу явно. `let` со строкой становится
  `string`, а не литералом. Пустой массив без аннотации — `never[]`, туда ничего
  не положить.
