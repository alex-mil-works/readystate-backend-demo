id: i01
kind: interview_phrasing
phase: phrasing
prompt: Объясните, что TypeScript проверяет, а что остаётся на runtime.
rubric: |-
  Ожидаемые пункты (30–60 сек):
  - проверка до запуска, типы стираются
  - ловит несогласованный вызов и форму, которую вы описали
  - не проверяет JSON, DOM, env
  - `as` — утверждение, не guard
sampleAnswer: TypeScript — компиляторная проверка. В бандле остаётся JavaScript,
  аннотации исчезают. Он видит код и объявленные типы, но не ответ сервера. Если
  написать `as User` на JSON, сборка молчит, а отсутствие поля всплывает уже в
  браузере.
