id: p03
kind: single_choice
phase: practice
prompt: "Функция объявлена как `(): void`. Что можно сделать с её результатом?"
options:
  - id: a
    text: Не опираться на него — контракт говорит «результат не для использования»
    correct: true
  - id: b
    text: Всегда получить `null`
  - id: c
    text: Считать, что она возвращает `undefined` как часть публичного API
  - id: d
    text: "`void` запрещает функции иметь `return`"
explain: "`void` описывает намерение вызывающего. Это не проверка значения в runtime."
