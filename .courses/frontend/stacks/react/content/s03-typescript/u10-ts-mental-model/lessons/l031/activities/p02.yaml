id: p02
kind: predict_output
phase: practice
code: |-
  function fail(message: string): never {
    throw new Error(message);
  }
  function label(kind: 'a' | 'b') {
    switch (kind) {
      case 'a':
        return 'A';
      case 'b':
        return 'B';
      default:
        return fail('unexpected');
    }
  }
question: Зачем в `default` возврат типа `never`?
choices:
  - id: a
    text: Если в union появится новый член, эта ветка перестанет компилироваться
    correct: true
  - id: b
    text: "`never` превращает throw в успешный `return`"
  - id: c
    text: Так `label` начинает возвращать `any`
  - id: d
    text: Компилятор пропускает `default` только с `any`
explain: Исчерпывающий `switch` плюс `never` подсвечивает забытый вариант на
  этапе сборки.
