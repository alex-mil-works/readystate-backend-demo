id: r01
kind: single_choice
phase: revision
prompt: Сборка зелёная, а экран падает на `user.email`. Какая граница дырявая?
options:
  - id: a
    text: Данные снаружи объявили типом, но не проверили
    correct: true
  - id: b
    text: TypeScript обязан валидировать `fetch` сам
  - id: c
    text: Браузер выключил strict mode
  - id: d
    text: Типы остались в бандле и конфликтуют с JSON
explain: Компилятор поверил аннотации. Источник `unknown` нужно сузить до использования.
hints:
  - title: Где тип честный
    markdown: "Честный тип стоит на границе: параметры, возврат, результат разбора.
      Внутри функции вывод часто достаточен."
  - title: "`as` не парсер"
    markdown: "`as User` не смотрит на объект. После него компилятор перестаёт
      спорить, даже если поля нет."
