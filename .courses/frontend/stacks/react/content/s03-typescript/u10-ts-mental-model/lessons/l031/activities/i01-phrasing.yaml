id: i01
kind: interview_phrasing
phase: phrasing
prompt: Сравните `any`, `unknown` и `never` на примере разбора внешнего ввода.
rubric: |-
  Ожидаемые пункты:
  - `any` глушит ошибки
  - `unknown` требует сужения
  - `never` для недостижимой ветки
  - `null` не входит в тип без явного union
sampleAnswer: "Внешний ввод я помечаю `unknown`. Пока нет проверки, поле не
  прочитать. `any` собрался бы, но упал в браузере. `never` ставлю в `default`,
  чтобы новый вариант union не прошёл мимо. `null` отдельно: без `| null`
  компилятор его в строку не пустит."
