kind: interview_phrasing
phase: phrasing
prompt: Как тег в union помогает UI-состоянию и чем `satisfies` отличается от
  аннотации?
rubric: |-
  Ожидаемые пункты:
  - общее литеральное поле
  - switch сужает остальные поля
  - аннотация расширяет тип переменной
  - satisfies проверяет и сохраняет узкий тип
sampleAnswer: Состояние экрана я делаю union с полем kind. В каждой ветке видны
  только её поля. Если повесить на объект маршрутов аннотацию Record, ключи
  станут string. satisfies проверяет, что значения похожи на путь, но home
  остаётся конкретным ключом.
