id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как провести JSON от fetch до типизированного состояния?
rubric: |-
  Ожидаемые пункты:
  - json это unknown/any, не User
  - as не проверяет
  - парсер или схема возвращает узкий тип или бросает
  - в state кладут уже разобранное
sampleAnswer: Ответ fetch я не называю User. Тело это unknown. Функция parseUser
  проверяет объект и id и либо возвращает узкий тип, либо бросает. В состояние
  попадает только результат парсера. as User я не использую как валидацию.
