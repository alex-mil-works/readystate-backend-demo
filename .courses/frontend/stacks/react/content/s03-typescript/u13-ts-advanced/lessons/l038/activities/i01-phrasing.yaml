id: i01
kind: interview_phrasing
phase: phrasing
prompt: Объясните structural typing и когда срабатывает excess property check.
rubric: |-
  Ожидаемые пункты:
  - сравниваются поля, не имена
  - более широкий объект можно передать
  - свежий литерал с лишним полем — ошибка
  - это не runtime-фильтр
sampleAnswer: TypeScript смотрит, есть ли нужные поля. Объект с лишним z можно
  передать как Point, если он уже лежит в переменной. Если тот же литерал
  написан прямо в вызове, лишнее поле — ошибка, это защита от опечатки. В
  runtime поле никуда не исчезает.
