id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как типизировать список, который рисует и уроки, и пользователей?
rubric: |-
  Ожидаемые пункты:
  - props generic по T
  - items, getKey и renderItem на одном T
  - явный аргумент типа, если вывод не справился
  - наружу экспортируют props, не внутренний state
sampleAnswer: List получает параметр T. Массив, ключ и render берут один и тот
  же T, поэтому урок не попадёт в рендер пользователя. Если вывод не справился,
  я пишу List с явным аргументом типа, а не any. Наружу экспортирую ListProps.
