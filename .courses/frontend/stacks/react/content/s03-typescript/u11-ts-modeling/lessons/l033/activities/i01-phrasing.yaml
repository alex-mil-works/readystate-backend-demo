id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как вы типизируете колбэк и когда берёте overload?
rubric: |-
  Ожидаемые пункты:
  - параметры и возврат явны
  - optional parameter это undefined, не null
  - overload описывает разрешённые вызовы
  - не использовать Function/any
sampleAnswer: Колбэк — это функция с известными аргументами, например id строкой
  и результат void. Необязательный параметр можно не передавать, внутри он
  string или undefined. Перегрузки оставляю, когда вызовы реально разные, и
  помню, что снаружи виден только этот список, не широкая реализация.
