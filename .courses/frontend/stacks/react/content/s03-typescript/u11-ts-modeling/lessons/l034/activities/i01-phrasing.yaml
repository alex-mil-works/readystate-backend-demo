id: i01
kind: interview_phrasing
phase: phrasing
prompt: Объясните union, intersection и зачем сужать тип перед вызовом метода.
rubric: |-
  Ожидаемые пункты:
  - union: один из
  - intersection: оба
  - до проверки доступно только общее
  - typeof / early return сужают
sampleAnswer: Union значит значение одного из типов, поэтому метод строки нельзя
  звать, пока не отсеяли число. Intersection требует поля обеих частей. После
  typeof или раннего return компилятор выкидывает невозможный вариант, но только
  у того значения, которое проверяли.
