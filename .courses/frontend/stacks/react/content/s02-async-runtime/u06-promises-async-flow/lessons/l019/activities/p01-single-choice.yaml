id: p01
kind: single_choice
phase: practice
prompt: |
  Один из промисов в `Promise.all` отклонился. Что верно?
options:
  - id: a
    text: '`all` отклоняется сразу, остальные промисы при этом сами не отменяются'
    correct: true
  - id: b
    text: '`all` ждёт всех и возвращает массив с `undefined` на месте ошибки'
  - id: c
    text: Остальные запросы автоматически обрываются
  - id: d
    text: '`all` превращается в `allSettled`'
explain: |
  Политика `all` — fail-fast для **результата**. Уже начатые операции продолжаются, пока вы сами их не отмените.
