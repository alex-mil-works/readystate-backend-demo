id: p03
kind: single_choice
phase: practice
prompt: |
  Почему длинный синхронный цикл блокирует и клики, и уже созданные промисы?
options:
  - id: a
    text: Колбэки не стартуют, пока не опустеет call stack
    correct: true
  - id: b
    text: Промисы выполняются в другом потоке, но клики ждут CSS
  - id: c
    text: '`setTimeout` внутри цикла всё равно вклинивается между итерациями'
  - id: d
    text: Event loop на время цикла ставится на паузу сборщиком мусора
explain: |
  Пока функция крутит цикл, стек не пуст. Очереди задач и микрозадач просто ждут.
