id: r01
kind: single_choice
phase: revision
prompt: |
  Почему анимация на `setTimeout(..., 16)` дёргается даже на свободном CPU?
options:
  - id: a
    text: Таймер не синхронизирован с кадром и может сработать до или после отрисовки
    correct: true
  - id: b
    text: 16 мс браузер всегда округляет до 4 мс
  - id: c
    text: '`setTimeout` блокирует compositor до конца колбэка'
  - id: d
    text: Кадр рисуется только из микрозадач
explain: |
  Кадр планирует браузер. rAF попадает в этот слот, таймер — нет.
hints:
  - title: Очереди
    markdown: |
      `queueMicrotask` и `then` раньше кадра. `setTimeout` — следующая task, уже после возможной отрисовки.
  - title: Задержка
    markdown: |
      `ms` у таймера — «не раньше». Вложенные таймеры и фоновая вкладка делают задержку ещё грубее.
      Для кадра берите `requestAnimationFrame`, не интервал 16 мс.
