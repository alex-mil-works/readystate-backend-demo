id: r01
kind: single_choice
phase: revision
prompt: |
  Что из этого ближе всего к правде про `Promise.then` и `setTimeout(..., 0)`?
options:
  - id: a
    text: Колбэк `then` — микрозадача и выполнится раньше таймера с нулевой задержкой
    correct: true
  - id: b
    text: Нулевая задержка таймера всегда обгоняет промис
  - id: c
    text: Оба колбэка синхронны, порядок равен порядку строк
  - id: d
    text: '`then` попадает в ту же очередь, что и таймеры, FIFO'
explain: |
  После стека рантайм вычитывает микрозадачи. Таймер — отдельная task и стоит за ними.
hints:
  - title: Порядок
    markdown: |
      Синхронный код, затем все микрозадачи, затем следующая task.

      ```js
      console.log('A');
      setTimeout(() => console.log('B'), 0);
      Promise.resolve().then(() => console.log('C'));
      console.log('D');
      // A D C B
      ```
  - title: Голодание
    markdown: |
      Микрозадача, которая снова ставит микрозадачу, не пускает таймеры и отрисовку.
      Длинная цепочка `then` — тоже работа на главном потоке.
