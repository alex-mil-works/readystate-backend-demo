id: p01
kind: single_choice
phase: practice
prompt: |
  Синхронный цикл на 200 мс уже крутится. Что даст вызов `requestAnimationFrame` из середины цикла?
options:
  - id: a
    text: Колбэк встанет в очередь кадра, но запустится только после выхода из текущего стека
    correct: true
  - id: b
    text: Цикл прервётся на ближайшем кадре сам
  - id: c
    text: Браузер отрисует кадр между итерациями
  - id: d
    text: Вызов бросит исключение, потому что rAF нельзя звать из цикла
explain: |
  Планирование кадра не вытесняет текущую функцию. Пока цикл не вернулся, ни кадр, ни клик не начнутся.
