    text: sync, micro, then, timer
    correct: true
  - id: b
    text: micro, then, sync, timer
  - id: c
    text: sync, timer, micro, then
  - id: d
    text: timer, sync, micro, then
explain: |
  `sync` — стек. `queueMicrotask` встал в очередь раньше `then`, оба раньше таймера.
