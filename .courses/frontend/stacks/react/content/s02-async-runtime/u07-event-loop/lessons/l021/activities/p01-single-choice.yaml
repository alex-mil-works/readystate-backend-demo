id: p01
kind: single_choice
phase: practice
prompt: |
  Что означает `setTimeout(fn, 0)` в браузере?
options:
  - id: a
    text: Поставить task, которая запустится не раньше опустошения стека и микрозадач
    correct: true
  - id: b
    text: Вызвать `fn` сразу после текущей строки
  - id: c
    text: Поставить микрозадачу наравне с `Promise.then`
  - id: d
    text: Гарантировать вызов через 0 миллисекунд по часам
explain: |
  Ноль — это нижняя граница ожидания, не точный слот. Колбэк всё равно task и стоит за микрозадачами.
