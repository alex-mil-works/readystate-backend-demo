id: r01
kind: single_choice
phase: revision
prompt: |
  Что из этого правда про long task и кадр?
options:
  - id: a
    text: Задача длиннее кадра задерживает и отрисовку, и обработчики ввода, пока не вернёт стек
    correct: true
  - id: b
    text: rAF автоматически вытесняет длинный цикл каждые 16 мс
  - id: c
    text: Long task считается только по времени сети
  - id: d
    text: Батчинг React переносит синхронный цикл на другой поток
explain: |
  Главный поток один. Пока задача не закончилась, очередь ввода и слот кадра ждут.
hints:
  - title: 50 мс
    markdown: |
      Ориентир long task — около 50 мс непрерывной работы на main thread.
      Клик, пришедший в это окно, обработается только после return.
  - title: Как уступить
    markdown: |
      Уступить можно только выйдя из функции и запланировав хвост: `setTimeout`, rAF или `scheduler.yield()`.
      Вызов rAF из середины цикла кадр не рисует.
