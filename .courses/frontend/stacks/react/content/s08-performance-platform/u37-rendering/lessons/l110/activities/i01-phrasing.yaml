id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем CSR отличается от SSR и чего боится гидрация?
rubric: |-
  Ожидаемые пункты:
  - CSR рисует после скрипта
  - SSR отдаёт HTML раньше
  - клики всё равно ждут клиент
  - дерево сервера и клиента должно совпасть
sampleAnswer: При клиентском рендере документ пустой, пока не выполнится скрипт.
  При серверном человек раньше видит текст, но кнопки оживают только после
  гидрации. Если клиент построил другое дерево, чем прислал сервер, React
  считает это ошибкой. Дату и случайные id в такой разметке не считают
  по-разному на двух сторонах.
