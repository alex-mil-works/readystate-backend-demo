id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем SSG отличается от SSR и что такое остров?
rubric: |-
  Ожидаемые пункты:
  - SSG считает HTML на сборке
  - личное и очень свежее ему не подходит
  - остров гидратирует только интерактив
  - комбайн нужен, когда режимов несколько
sampleAnswer: SSG отдаёт уже собранный HTML, поэтому он быстрый для общей статьи
  и плохой для личной корзины. SSR считает страницу на запрос. Остров оживляет
  только плеер или форму, а не весь документ. Отдельный мета-фреймворк имеет
  смысл, когда таких режимов на сайте несколько, а не ради одного статического
  текста.
