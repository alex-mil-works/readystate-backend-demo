id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем Next, Astro и фреймворк-роутер отличаются как продукты?
rubric: |-
  Ожидаемые пункты:
  - Next совмещает маршруты, данные и режимы рендера
  - Astro по умолчанию экономит клиентский JS
  - роутер-фреймворк — про приложение и вложенные маршруты
  - модель компонентов остаётся
sampleAnswer: "Next — соглашение для приложения: где взять данные и где рисовать
  дерево. Astro уместен, когда страница в основном документ, а React нужен
  островком. Режим фреймворка у React Router ближе к приложению с маршрутами, но
  это не копия Next. Ни один из них не заменяет понимание state и гидрации."
