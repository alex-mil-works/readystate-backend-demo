id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем отличаются localStorage, IndexedDB и Cache API?
rubric: |-
  Ожидаемые пункты:
  - строки и главный поток против базы
  - Cache API для ответов сети
  - квота не вечна
  - другой браузер этой базы не видит
sampleAnswer: localStorage — короткие строки, чтение блокирует поток, скрипт всё
  видит. Прогресс записями я кладу в IndexedDB. Ответы для офлайна — в Cache
  API, это не таблица пользователей. Браузер может данные вытеснить, а телефон
  сам эту базу не подхватит, пока нет синхронизации.
