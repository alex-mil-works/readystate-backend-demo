id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как Service Worker связан с кэшем и почему он может застрять на старой версии?
rubric: |-
  Ожидаемые пункты:
  - это прокси со своим циклом
  - fetch выбирает кэш или сеть
  - кэш надо версионировать
  - новая версия не всегда сразу забирает открытые вкладки
sampleAnswer: Service Worker перехватывает запросы отдельно от страницы. В fetch
  он может отдать кэш. Если имя кэша не менять и не ходить в сеть, человек
  останется на старых файлах. Новый воркер часто ждёт, пока отпустятся старые
  вкладки, поэтому выкладка и обновление экрана — не один момент.
