id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как вы отличаете офлайн-заглушку от offline-first и когда обновляете версию?
rubric: |-
  Ожидаемые пункты:
  - манифест не гарантирует кнопку установки
  - заглушка, если данных локально нет
  - полноценный офлайн только если так задумано
  - не перезагружать посреди ввода
sampleAnswer: Манифест описывает имя и окно, а показывать ли установку, решает
  браузер. Если без сети урока нет, я показываю честную заглушку, а не пустую
  ленту. Если данные правда кэшируются, это уже отдельный сценарий. Новую версию
  воркера я предлагаю явно, а не перезагружаю страницу, пока человек пишет
  ответ.
