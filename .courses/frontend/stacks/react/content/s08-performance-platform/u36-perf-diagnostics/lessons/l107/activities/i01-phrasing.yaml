id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что измеряют LCP, CLS и INP?
rubric: |-
  Ожидаемые пункты:
  - LCP — когда готово главное содержимое
  - CLS — самопроизвольный прыжок вёрстки
  - INP — задержка после действия
  - полевые данные важнее одного лабораторного балла
sampleAnswer: LCP говорит, когда пользователь увидел главный кусок экрана. CLS —
  прыгала ли страница сама, пока грузились картинки и шрифты. INP — сколько
  прошло от клика или клавиши до кадра. Это разные поломки. Смотреть стоит на
  реальных визитах, а не на одном прогоне локально.
