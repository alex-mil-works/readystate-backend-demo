id: i01
kind: interview_phrasing
phase: phrasing
prompt: Зачем бюджет производительности и чем он отличается от RAIL?
rubric: |-
  Ожидаемые пункты:
  - бюджет — числовой предел
  - его видно в CI
  - RAIL и PRPL — памятки порядка работ
  - не каждый килобайт равен регрессии первого экрана
sampleAnswer: Бюджет заранее говорит, сколько может весить первый скрипт или
  каким должен быть лабораторный LCP. Скачок ловят в ревью. RAIL и PRPL
  напоминают, что отклик, кадр и ленивая догрузка — разные работы, но сами по
  себе они не число. Мелочь в общем чанке я не путаю с мегабайтом на первом
  экране.
