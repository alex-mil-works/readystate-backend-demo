id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как вы пользуетесь Lighthouse и записью в DevTools?
rubric: |-
  Ожидаемые пункты:
  - запись сети и главного потока
  - Lighthouse — лабораторный список гипотез
  - балл скачет и не заменяет поле
  - правка после повторной записи
sampleAnswer: "Сначала я записываю сеть и главный поток: кто блокирует документ
  и какая задача длинная. Lighthouse даёт список гипотез в искусственных
  условиях, но один балл я не лечу. Если полевые метрики спокойны, а замечание
  про чужой сценарий, я его не ставлю выше реальной боли. После правки запись
  повторяю."
