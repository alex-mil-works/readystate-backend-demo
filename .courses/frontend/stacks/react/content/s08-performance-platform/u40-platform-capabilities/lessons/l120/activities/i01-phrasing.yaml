id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как просить разрешение устройства и что делать после отказа?
rubric: |-
  Ожидаемые пункты:
  - просить в момент нужды
  - не на первой загрузке и не циклом
  - уважать denied
  - оставить сценарий без этой возможности
  - нужен безопасный контекст
sampleAnswer: Диалог геолокации или уведомлений я открываю, когда человек уже
  выбрал действие, которому это нужно. На загрузке страницы не спрашиваю. Если
  он отказал, я не кручу запрос снова и оставляю путь без этой возможности. На
  обычном http многих API просто нет.
