id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда уместны свои элементы и что изолирует Shadow DOM?
rubric: |-
  Ожидаемые пункты:
  - виджет на чужих страницах
  - тень не пускает стили внутрь и наружу
  - контракт: атрибуты, слоты, события
  - не замена компонентной модели всего приложения
sampleAnswer: "Свой элемент уместен, когда один виджет должны встроить разные
  страницы и стили нельзя смешать. Shadow DOM как раз прячет внутренности.
  Снаружи я оставляю атрибуты, слоты и события. Весь интерфейс урока ради этого
  переписывать не нужно: там хватает обычных компонентов и локальных классов."
