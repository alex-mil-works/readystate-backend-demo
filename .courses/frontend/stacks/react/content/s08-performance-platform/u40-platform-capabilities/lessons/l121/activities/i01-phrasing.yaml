id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем passkey отличается от пароля в браузерном хранилище и как строить оплату?
rubric: |-
  Ожидаемые пункты:
  - закрытый ключ не в JavaScript
  - подпись проверяет сервер
  - номер карты не кладут в state
  - API обнаруживают и оставляют другой путь
sampleAnswer: "Passkey не хранит секрет в localStorage: закрытый ключ остаётся у
  платформы, сервер проверяет подпись. Фронтенд только начинает вход и умеет
  запасной способ. Платёжный диалог, если он есть, не повод сохранять номер
  карты в React. Если API нет, показываю другой уже готовый путь."
