id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда вы берёте grid, а когда flex?
rubric: |-
  Ожидаемые пункты:
  - grid задаёт строки и колонки
  - fr и minmax
  - flex для одного ряда внутри ячейки
  - данные остаются таблицей
sampleAnswer: "Если блоки стоят и в ряд, и в колонку по задуманной сетке, это
  grid: меню фиксировано, контент 1fr. Ряд кнопок внутри ячейки я оставлю flex.
  Расписание с заголовками колонок сверстаю таблицей, не сеткой div."
