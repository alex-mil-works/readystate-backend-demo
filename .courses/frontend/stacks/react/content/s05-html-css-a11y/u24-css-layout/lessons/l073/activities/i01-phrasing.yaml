id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как вы строите адаптив и какие единицы берёте для текста?
rubric: |-
  Ожидаемые пункты:
  - база узкая, min-width добавляет колонки
  - брейкпоинт от контента
  - rem для текста
  - не запрещать зум, осторожно с 100vh
sampleAnswer: "Сначала одна колонка без медиазапроса. Когда контенту тесно,
  min-width добавляет сетку. Текст в rem, чтобы уважать настройки шрифта. Зум не
  отключаю. Высоту экрана не прибиваю к 100vh: на телефоне панели браузера её
  съедают."
