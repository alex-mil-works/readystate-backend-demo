kind: interview_phrasing
phase: phrasing
prompt: Как вы уважаете prefers-reduced-motion в интерфейсе?
rubric: |-
  Ожидаемые пункты:
  - декоративные переходы выключают
  - состояние не завязано только на анимацию
  - скриптовое движение читает matchMedia
  - автоплей ставят на паузу
sampleAnswer: Если у человека reduce, я убираю слайды и бесконечные фоны.
  Вкладка всё равно переключается, тост всё равно содержит текст. Скрипт,
  который сам крутит кадры, проверяет matchMedia и не запускает цикл. Автоплей
  видео ставлю на паузу.
