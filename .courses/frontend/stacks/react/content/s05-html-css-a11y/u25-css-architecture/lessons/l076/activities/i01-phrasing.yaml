id: i01
kind: interview_phrasing
phase: phrasing
prompt: Где проходит граница стилей компонента и темы?
rubric: |-
  Ожидаемые пункты:
  - цвета и шаги из токенов
  - не красить внутренности чужого блока
  - вариант — публичный API
  - рантайм CSS-in-JS имеет цену
sampleAnswer: "Цвет и отступ компонент берёт из токена, а не из нового hex.
  Снаружи я не лезу селектором во внутренний span кнопки: прошу variant. Стили,
  которые можно собрать на билде модулем или утилитой, я не вставляю рантаймом
  на каждый рендер."
