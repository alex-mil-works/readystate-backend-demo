prompt: Какую пользу и какую цену даёт utility-first?
rubric: |-
  Ожидаемые пункты:
  - значения из темы
  - разметка шумит на повторах
  - повтор выносят в компонент
  - классы не заменяют button и a
sampleAnswer: Утилиты держат отступы и кегль на общей шкале, меньше магических
  пикселей. Длинная копипаста классов разъезжается, поэтому повтор я собираю
  компонентом. @apply не лепит на каждый вариант. И курсор pointer на div не
  делает ссылку.
