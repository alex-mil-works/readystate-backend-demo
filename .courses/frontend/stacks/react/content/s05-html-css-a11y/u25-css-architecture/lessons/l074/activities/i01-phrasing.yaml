id: i01
kind: interview_phrasing
phase: phrasing
prompt: Зачем BEM и CSS Modules, если можно писать короткие классы?
rubric: |-
  Ожидаемые пункты:
  - имя блока не бьёт чужой экран
  - не стилизовать внутренности чужого компонента
  - модуль делает класс локальным
  - глобальными остаются токены
sampleAnswer: "Короткий класс title в глобальном CSS перекрасит все заголовки.
  BEM привязывает вид к блоку. CSS Modules делает имя локальным для файла.
  Внутрь чужой кнопки селектором из карточки я не залезаю: у кнопки свой
  публичный класс. Глобально живут токены и reset."
