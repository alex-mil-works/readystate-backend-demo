id: p02
kind: single_choice
phase: practice
prompt: Стили зависят от пропа variant у кнопки, остальной проект на CSS
  Modules. В чём риск рантайм CSS-in-JS на каждую кнопку?
options:
  - id: a
    text: Цена на рендере и сложнее согласованный CSS на сборке
    correct: true
  - id: b
    text: Модули не умеют классы
  - id: c
    text: Вариант нельзя выразить классом
  - id: d
    text: Токены работают только в Sass
explain: Вариант чаще всего класс или data-атрибут. Рантайм окупается, когда
  стиль правда считается из данных.
