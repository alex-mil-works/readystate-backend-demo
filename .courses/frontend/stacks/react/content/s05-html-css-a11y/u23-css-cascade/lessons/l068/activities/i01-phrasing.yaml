id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как каскад выбирает цвет и что не наследуется?
rubric: |-
  Ожидаемые пункты:
  - специфичность важнее порядка
  - при равенстве побеждает правило ниже
  - класс бьёт элемент
  - margin и border не наследуются, color наследуется
sampleAnswer: "Сначала сравнивают вес: класс сильнее голого тега, даже если тег
  написан ниже. Если вес равный, побеждает правило ниже по файлу. important я
  почти не использую. Цвет текста дети получают сами, а margin и рамку нужно
  задать на блоке."
