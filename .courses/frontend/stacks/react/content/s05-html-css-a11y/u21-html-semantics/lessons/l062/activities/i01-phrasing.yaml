id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как вы строите каркас страницы для скринридера и для оглавления?
rubric: |-
  Ожидаемые пункты:
  - landmarks: header, nav, main, footer
  - один main, подпись у второго nav
  - заголовки по уровням, не по размеру
  - section без имени не заменяет h2
sampleAnswer: "Каркас — header, nav, один main и footer. Второе меню подписываю,
  иначе его не отличить. Заголовки идут по уровням: h1, потом h2. Мелкий вид я
  задаю стилем, а не пропуском уровней. Безымянный div в оглавление не
  попадает."
