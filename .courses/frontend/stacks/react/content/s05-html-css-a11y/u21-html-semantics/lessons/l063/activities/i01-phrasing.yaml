id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда вы берёте ссылку, кнопку, alt и таблицу?
rubric: |-
  Ожидаемые пункты:
  - ссылка ведёт на адрес
  - кнопка делает действие
  - div с кликом не замена
  - alt и th дают текстовый эквивалент
sampleAnswer: Если есть URL, это ссылка. Если команда на странице — кнопка, не
  кликабельный div. Содержательной картинке нужен alt, декоративной — пустой.
  Таблицу я оставляю данным с заголовками колонок, а не сетке страницы.
