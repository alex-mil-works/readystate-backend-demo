id: p03
kind: single_choice
phase: practice
prompt: Переход на урок сделан div, который оживает только после JS. Чем это
  хуже ссылки?
options:
  - id: a
    text: До скрипта по адресу не перейти, и это не ссылка в принципе
    correct: true
  - id: b
    text: Ссылка не может вести на тот же origin
  - id: c
    text: div индексируется лучше
  - id: d
    text: title тогда не нужен
explain: Ссылка работает как HTML. Скрипт может перехватить клик и не
  перезагружать страницу.
