id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что должно быть у документа до вашего JavaScript?
rubric: |-
  Ожидаемые пункты:
  - lang и осмысленный title
  - ссылки и формы как HTML
  - скрипт улучшает, не заменяет переход
  - одинаковый title на все экраны бесполезен
sampleAnswer: "У документа есть язык и свой title на экран. Переход — ссылка,
  отправка — форма: они работают и до гидрации. Скрипт может перехватить клик,
  но не обязан быть единственным способом открыть урок."
