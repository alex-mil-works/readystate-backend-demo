id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как у поля появляется имя и как не потерять фокус?
rubric: |-
  Ожидаемые пункты:
  - label, не placeholder
  - у иконки-кнопки есть имя
  - фокус виден, outline не стирают без замены
  - tabindex больше нуля не используют
sampleAnswer: "Имя поля — это label, связанный с input. Placeholder только
  подсказывает. Кнопке с одной иконкой я даю aria-label. Обводку фокуса не
  удаляю в никуда: для клавиатуры оставляю :focus-visible. Порядок Tab — порядок
  документа, без положительного tabindex."
