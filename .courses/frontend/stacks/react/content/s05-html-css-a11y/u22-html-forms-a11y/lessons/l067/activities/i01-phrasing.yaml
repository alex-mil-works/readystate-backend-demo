id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда ARIA уместна и чего она не делает?
rubric: |-
  Ожидаемые пункты:
  - сначала нативный тег
  - роль не добавляет клавиатуру
  - expanded и controls описывают состояние
  - aria-hidden не вешают на саму кнопку
sampleAnswer: "Кнопку и ссылку я не собираю из div с ролью. ARIA нужна
  составному виджету: сказать, что панель открыта, через aria-expanded. Роль
  сама не ловит Enter. aria-hidden я ставлю на декоративную иконку, а не на
  кнопку, иначе она пропадёт из дерева."
