id: i01
kind: interview_phrasing
phase: phrasing
prompt: Из чего собирается форма ещё до библиотеки компонентов?
rubric: |-
  Ожидаемые пункты:
  - form, label, настоящий input, button
  - type=button у кнопок, которые не отправляют
  - required и type как первая проверка
  - fieldset и legend для группы
sampleAnswer: Форма — это form с полями и кнопкой submit. Поле остаётся input
  или select, не div. Кнопка-иконка внутри формы имеет type=button. Пустое
  required-поле браузер не отправит. Группу радиокнопок я подписываю legend.
