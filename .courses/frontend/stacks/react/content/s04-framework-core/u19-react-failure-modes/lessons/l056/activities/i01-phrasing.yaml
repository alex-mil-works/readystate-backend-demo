id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда memo не помогает и чем это связано со ссылками?
rubric: |-
  Ожидаемые пункты:
  - memo сравнивает props через Object.is
  - новый объект и новая функция всегда «другие»
  - useCallback с пустыми зависимостями врёт про снимок
  - сначала опустить state
sampleAnswer: memo смотрит, те же ли ссылки у props. Инлайн-объект и стрелка
  создаются заново, поэтому ребёнок рендерится всё равно. useCallback сохраняет
  функцию, но зависимости должны включать id, иначе клик закроет старое
  значение. До этого я проверяю, не лежит ли state слишком высоко.
