id: i01
kind: interview_phrasing
phase: phrasing
prompt: Назовите три частые ошибки с эффектами и чем их заменить.
rubric: |-
  Ожидаемые пункты:
  - не копировать props в state без черновика
  - клик обрабатывать в обработчике
  - setState в эффекте без зависимостей зацикливает
  - сброс формы через key
sampleAnswer: Нельзя эффектом дублировать props, которые рендер и так видит.
  Отправка по кнопке живёт в onSubmit, а не в флаге. Эффект, который всегда
  делает setState, крутит рендеры. Сбросить черновик при новом уроке проще новым
  key, чем синхронизацией в эффекте.
