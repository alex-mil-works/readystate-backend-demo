id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как вы решаете, оптимизировать ли рендер?
rubric: |-
  Ожидаемые пункты:
  - профайлер показывает коммит и причину
  - дешёвый частый рендер можно оставить
  - высокий state перерисовывает соседей
  - memo после размещения state
sampleAnswer: Сначала смотрю, какой state вызвал коммит и сколько он занял. Если
  поиск в корне перерисовывает карту, я опускаю query вниз или изолирую карту.
  Мемоизация без этого только маскирует новые объекты. Дешёвые рендеры я не
  лечу.
