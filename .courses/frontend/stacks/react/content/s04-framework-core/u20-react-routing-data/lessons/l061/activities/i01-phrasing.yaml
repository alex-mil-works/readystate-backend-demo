id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как выбрать между локальным state, Context и кэшем запроса?
rubric: |-
  Ожидаемые пункты:
  - локально у владельца экрана
  - Context для редких данных на дерево
  - частый Context перерисовывает потребителей
  - ответ сервера — отдельный кэш, не UI-флаг
sampleAnswer: "Поле и модалка живут в ближайшем компоненте. Тему я кладу в
  Context, потому что она нужна глубоко и меняется редко. Поиск туда не кладу:
  каждый символ разбудит всё дерево. Ответ API держу отдельно, со статусом и
  отменой, а не в том же useState, что и открыта ли панель."
