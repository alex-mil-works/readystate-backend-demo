id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что хранят в URL, а что в локальном state?
rubric: |-
  Ожидаемые пункты:
  - путь и query для экрана, которым делятся
  - обновление и назад читают адрес
  - черновик сеанса может быть локальным
  - pushState сам не рендерит React
sampleAnswer: Урок и вкладка, которые я хочу открыть ссылкой, живут в URL.
  Роутер читает адрес и рендерит экран. Отдельный useState с тем же id
  разъедется с кнопкой назад. Черновик поля на один заход можно оставить в state
  формы. Сам pushState адрес меняет, но дерево обновит только подписка роутера.
