id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда вы берёте ref, а когда state?
rubric: |-
  Ожидаемые пункты:
  - ref не запускает рендер
  - фокус, узел, экземпляр библиотеки
  - данные экрана живут в state
  - виджет создают в эффекте и снимают в cleanup
sampleAnswer: Ref — мутабельный бокс. Я кладу туда узел, чтобы вызвать focus,
  или экземпляр графика. Запись туда не обновляет экран, поэтому имя и флаги
  остаются в state. Виджет, которому нужен реальный элемент, создаю в эффекте и
  уничтожаю в cleanup.
