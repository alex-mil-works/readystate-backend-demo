id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как вы режете UI на компоненты и куда кладёте общий state?
rubric: |-
  Ожидаемые пункты:
  - слоты вместо гигантского enum
  - граница там, где есть смысл или state
  - ближайший общий родитель
  - слишком высокий state перерисовывает лишнее
sampleAnswer: "Рамку я оставляю тупой: заголовок, children, слот кнопок.
  Содержимое передаёт экран. Общий флаг двух полей живёт в их ближайшем
  родителе. Если положить его в корень, вместе с диалогом заново вызывается и
  тяжёлое дерево, которому флаг не нужен."
