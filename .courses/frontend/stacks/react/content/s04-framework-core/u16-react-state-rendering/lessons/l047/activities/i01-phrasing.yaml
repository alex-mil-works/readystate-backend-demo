id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что значит «state — снимок» и когда нужен функциональный setState?
rubric: |-
  Ожидаемые пункты:
  - рендер закрывает свои значения
  - setState планирует следующий рендер
  - два setN(n+1) не дают +2
  - updater читает предыдущее значение в очереди
sampleAnswer: В обработчике n — это число того рендера, который создал функцию.
  setState не меняет его на месте, а просит новый рендер. Два раза прибавить
  закрытый n — всё ещё +1. Если шаг зависит от предыдущего state, я передаю
  функцию, и React сложит обновления по очереди.
