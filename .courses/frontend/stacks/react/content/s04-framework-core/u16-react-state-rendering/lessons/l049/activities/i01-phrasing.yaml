id: i01
kind: interview_phrasing
phase: phrasing
prompt: Почему state обновляют иммутабельно и что не стоит класть в state?
rubric: |-
  Ожидаемые пункты:
  - новая ссылка, старый объект не мутировать
  - вложенные поля копируют по пути
  - производное считают в рендере
  - эффект, который копирует state в state, разъезжается
sampleAnswer: Я отдаю в setState новый объект или массив, а не правлю старый.
  Иначе прошлый снимок испорчен и React может не заметить изменение. Полное имя,
  фильтр и счётчик я считаю в рендере из источника. Отдельный state, который
  эффект постоянно догоняет, даёт лишний кадр со старым значением.
