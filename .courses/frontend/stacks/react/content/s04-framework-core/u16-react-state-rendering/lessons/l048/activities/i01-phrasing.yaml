id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как React понимает, что строка списка — та же, и чем плох key по индексу?
rubric: |-
  Ожидаемые пункты:
  - сверка по типу и позиции
  - key различает братьев
  - индекс ломается при вставке и сортировке
  - random сбрасывает state каждый рендер
sampleAnswer: React сопоставляет узлы по месту в дереве. В списке место
  дополняют key. Если key — индекс, после удаления или сортировки тот же номер
  указывает на другую сущность, и локальный state поля остаётся на старом
  номере. Стабильный id сохраняет личность строки. Случайный key каждый рендер
  создаёт строку заново.
