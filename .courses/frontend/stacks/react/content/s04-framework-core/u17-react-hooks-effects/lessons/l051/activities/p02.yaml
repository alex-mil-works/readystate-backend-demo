id: p02
kind: predict_output
phase: practice
code: |-
  useEffect(() => {
    const id = setInterval(() => console.log(count), 1000);
    return () => clearInterval(id);
  }, []);
question: Пользователь кликами поднял count с 0 до 3. Что печатает интервал?
choices:
  - id: a
    text: "0: пустые зависимости закрыли первый снимок и не перезапускают эффект"
    correct: true
  - id: b
    text: 3 сразу, интервал читает state сам
  - id: c
    text: "Ничего: cleanup запрещает setInterval"
  - id: d
    text: Каждый рендер создаёт новый интервал поверх старого
explain: Пустой массив не следит за count. Cleanup старого интервала тоже не
  вызывается, пока компонент жив.
