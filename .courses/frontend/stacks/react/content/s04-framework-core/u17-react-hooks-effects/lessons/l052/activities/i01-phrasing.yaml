id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем custom hook отличается от компонента и от обычной функции?
rubric: |-
  Ожидаемые пункты:
  - имя use*, вызывает другие хуки
  - каждый вызов — свои слоты
  - не шарит state сам
  - утилита без хуков не должна звать useState
sampleAnswer: Хук выносит связку состояния и эффекта, а не разметку. Его зовут с
  верхнего уровня, каждый вызов помнит свои данные. Два useToggle не связаны.
  Обычная функция вроде formatName не хранит state и не вызывает хуки.
