id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как устроен useState и когда вы передаёте функцию в setter?
rubric: |-
  Ожидаемые пункты:
  - слот по порядку вызовов
  - нельзя под if
  - начальное значение только в первый раз
  - updater, если шаг от предыдущего state
sampleAnswer: useState занимает слот в компоненте по порядку, поэтому я вызываю
  его всегда наверху. Начальный аргумент берётся один раз. Если новое число
  зависит от старого, я пишу setCount с функцией, иначе два обновления в одном
  клике затрут друг друга снимком.
