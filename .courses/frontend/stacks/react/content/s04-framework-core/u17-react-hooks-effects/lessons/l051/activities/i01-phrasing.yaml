id: i01
kind: interview_phrasing
phase: phrasing
prompt: Зачем эффект, что перечисляют в зависимостях и зачем cleanup?
rubric: |-
  Ожидаемые пункты:
  - синхронизация с внешним миром, не любой код после рендера
  - клик остаётся обработчиком
  - зависимости — прочитанные значения
  - cleanup снимает прошлый эффект
sampleAnswer: "Эффект нужен, когда экран должен совпасть с чем-то вне React:
  таймер, подписка, title. Зависимости перечисляют то, что эффект замкнул, иначе
  внутри навсегда первый снимок. Cleanup убирает прошлую подписку перед новым
  запуском и при уходе. Отправку по кнопке я делаю в обработчике, а не флагом в
  эффекте."
