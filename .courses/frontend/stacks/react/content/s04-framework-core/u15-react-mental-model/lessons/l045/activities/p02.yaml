    text: Родитель, внутри своего обработчика
    correct: true
  - id: b
    text: Child, потому что кнопка стоит в нём
  - id: c
    text: React сам пишет в props.value
  - id: d
    text: "Никто: колбэк только для логов"
explain: Колбэк — способ попросить владельца. Данные по-прежнему живут наверху.
