id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем декларативный UI отличается от ручного DOM и где ручной DOM ещё нужен?
rubric: |-
  Ожидаемые пункты:
  - рендер описывает экран от состояния
  - React сверяет описание с узлами
  - не править тот же текст вручную
  - фокус и чужие виджеты — граница
sampleAnswer: Я описываю, что должно быть на экране при текущих данных. React
  решает, какие узлы поменять. Если параллельно писать в textContent, следующий
  рендер с этим разойдётся. Императивно я оставляю фокус, измерения и
  библиотеки, которым нужен живой узел.
