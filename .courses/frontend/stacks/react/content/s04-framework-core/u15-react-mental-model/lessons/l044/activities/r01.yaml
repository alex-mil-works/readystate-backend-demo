id: r01
kind: single_choice
phase: revision
prompt: Чем React-элемент отличается от DOM-узла?
options:
  - id: a
    text: Элемент — данные о том, что показать; узел — объект документа
    correct: true
  - id: b
    text: Это одно и то же после JSX
  - id: c
    text: Элемент живёт только в CSS
  - id: d
    text: DOM-узел нельзя создать без класса компонента
explain: "Описание можно сравнить и выбросить. Узел дороже: у него есть
  состояние браузера."
hints:
  - title: Тип
    markdown: Строка `button` — хост-элемент. Функция `SaveButton` — компонент. Оба
      становятся элементами, но React вызывает только функцию.
