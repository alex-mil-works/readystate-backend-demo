id: i01
kind: interview_phrasing
phase: phrasing
prompt: Объясните однонаправленный поток и зачем композиция вместо иерархии
  компонентов.
rubric: |-
  Ожидаемые пункты:
  - props читают, не мутируют
  - наверх только колбэк владельца
  - children и слоты собирают UI снаружи
  - не подкласс на каждый вариант
sampleAnswer: "Данные принадлежат родителю и приходят вниз как props. Ребёнок не
  переписывает их, а вызывает колбэк, если нужно другое значение. Разные экраны
  я собираю композицией: рамка принимает children, содержимое решает вызывающий.
  Наследование компонентов для этого не нужно."
