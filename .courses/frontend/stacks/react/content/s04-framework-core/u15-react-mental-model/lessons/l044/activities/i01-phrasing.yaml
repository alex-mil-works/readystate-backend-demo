id: i01
kind: interview_phrasing
phase: phrasing
prompt: Объясните, что такое JSX, элемент и компонент.
rubric: |-
  Ожидаемые пункты (30–60 сек):
  - JSX превращается в объект-описание
  - элемент ещё не DOM
  - компонент — функция, которая возвращает описание
  - рендер не должен лазить в документ
sampleAnswer: "JSX — это запись объекта: тип, props, дети. Элемент описывает
  интерфейс, а DOM появляется, когда React применяет описание. Компонент —
  функция, которая по входным данным возвращает такое описание. В её теле я
  считаю UI, а не ищу узлы через document."
