id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда нужен Playwright и как не сделать его хрупким?
rubric: |-
  Ожидаемые пункты:
  - только путь через браузер: URL, форма, перезагрузка
  - не дублировать чистые функции
  - ждать условие, не sleep
  - данные теста изолированы
sampleAnswer: "Сквозной тест я оставляю на то, что без браузера не доказать:
  открылся адрес, клик по ссылке, статус на месте после обновления. Чистую
  функцию туда не тащу. Паузы заменяю ожиданием текста или URL. Данные сценарий
  создаёт сам, чтобы соседний тест их не портил."
