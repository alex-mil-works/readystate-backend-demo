id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что такое юнит-тест и где граница мока?
rubric: |-
  Ожидаемые пункты:
  - проверяет вход и выход без браузера
  - детерминированный
  - мок на сети и времени
  - не мокать свою реализацию
sampleAnswer: "Юнит вызывает функцию и проверяет результат. Браузер и сеть ему
  не нужны, поэтому он быстрый. Часы и запросы я подменяю, иначе тест мигает.
  Внутренние хелперы не мокаю: иначе я проверяю, как функция устроена, а не что
  она вернула."
