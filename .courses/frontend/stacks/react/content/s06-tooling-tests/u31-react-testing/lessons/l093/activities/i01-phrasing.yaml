id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как Testing Library выбирает, что считать контрактом компонента?
rubric: |-
  Ожидаемые пункты:
  - роль и доступное имя
  - текст результата
  - user-event, не вызов пропа
  - класс и число рендеров не контракт
sampleAnswer: "Я ищу кнопку по роли и имени «Сохранить», жму её как пользователь
  и читаю текст статуса. Класс и то, сколько раз вызвался хук, тестом не
  фиксирую: вёрстку можно сменить, не ломая сценарий. Если кнопку нельзя найти
  по имени, это ещё и дыра доступности."
