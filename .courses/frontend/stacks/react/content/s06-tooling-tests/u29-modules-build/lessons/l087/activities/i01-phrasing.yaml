id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем дев-сервер Vite отличается от прод-сборки?
rubric: |-
  Ожидаемые пункты:
  - в деве браузер грузит ESM по запросу
  - зависимости предсобираются
  - build минифицирует и режет чанки
  - зелёный дев не заменяет команду сборки
sampleAnswer: "В разработке Vite не собирает всё приложение заново: браузер
  берёт изменённый модуль. Тяжёлые зависимости из node_modules предсобираются
  один раз. Прод-команда проходит весь граф, жмёт и режет чанки. Поэтому перед
  поставкой я запускаю build, даже если дев уже зелёный."
