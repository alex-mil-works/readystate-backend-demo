id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем статический import отличается от import() и что попадает в первый бандл?
rubric: |-
  Ожидаемые пункты:
  - статический import строит граф до запуска
  - в бандл идёт достижимое из входа
  - import() откладывает чанк
  - цикл оставляет экспорт неинициализированным
sampleAnswer: Статический import виден сборщику заранее. В первый файл попадает
  то, до чего есть путь от входа. import() я ставлю на редкий экран, чтобы его
  код скачался потом. Если два модуля импортируют друг друга, легко прочитать
  экспорт слишком рано и получить пустое значение.
