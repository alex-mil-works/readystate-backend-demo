id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем транспилятор отличается от бандлера и зачем tree-shaking?
rubric: |-
  Ожидаемые пункты:
  - транспилятор переписывает синтаксис
  - бандлер собирает граф в файлы поставки
  - недостижимый экспорт можно выкинуть
  - дев и прод могут использовать разные инструменты
sampleAnswer: tsc или SWC превращают TypeScript в JavaScript, но не решают,
  сколько файлов уедет пользователю. Бандлер идёт по импортам, склеивает и может
  выкинуть экспорт, который никто не импортировал. В деве Vite отдаёт модули
  почти как есть, а в проде уже собирает чанки.
