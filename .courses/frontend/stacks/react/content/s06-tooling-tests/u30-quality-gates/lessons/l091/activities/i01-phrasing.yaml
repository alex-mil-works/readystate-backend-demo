id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как устроены source map и клиентские переменные окружения?
rubric: |-
  Ожидаемые пункты:
  - карта ведёт из минифицированного кода в исходник
  - карту можно не отдавать публично
  - VITE_ попадает в бандл
  - секрет в клиенте уже не секрет
  - ошибку сборки читают по модулю
sampleAnswer: Source map связывает сжатый файл со строкой исходника, чтобы стек
  можно было читать. Её не обязательно класть на публичный сайт. Переменная с
  префиксом VITE_ впекается в браузерный бандл, поэтому пароль туда не пишут.
  Если сборка упала, я смотрю модуль внизу лога, а не слово failed.
