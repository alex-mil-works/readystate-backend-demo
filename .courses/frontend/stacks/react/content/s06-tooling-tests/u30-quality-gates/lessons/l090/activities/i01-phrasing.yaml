id: i01
kind: interview_phrasing
phase: phrasing
prompt: Из чего состоит контур качества и почему его не обходят?
rubric: |-
  Ожидаемые пункты:
  - типы, линт, тесты, сборка
  - CI вызывает те же скрипты
  - красное не вливают
  - e2e реже, чем юниты
sampleAnswer: Типы ловят контракт, линтер известные ловушки, тесты поведение,
  сборка поставку. В package.json это явные скрипты, и CI зовёт их же. Если хук
  красный, я чиню файл, а не пропускаю проверку. Тяжёлый браузерный прогон
  оставляю на границу поставки.
