id: i01
kind: interview_phrasing
phase: phrasing
prompt: Почему ESLint и Prettier не заменяют друг друга?
rubric: |-
  Ожидаемые пункты:
  - линтер ловит опасные конструкции
  - форматтер печатает один вид
  - их не сталкивают на пробелах
  - шумное правило выключают
sampleAnswer: "Prettier не знает, что хук нельзя звать под if. ESLint не должен
  спорить с ним о кавычках. Я оставляю линтеру смысл, форматтеру вид и гоняю оба
  в CI. Правило, которое все глушат, я удаляю: оно учит обходить проверку."
