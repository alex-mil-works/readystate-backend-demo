id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем merge отличается от rebase и когда rebase уже опасен?
rubric: |-
  Ожидаемые пункты:
  - коммит это снимок, ветка это указатель
  - merge не переписывает хеши
  - rebase перекладывает коммиты и меняет хеши
  - чужую опубликованную историю не переписывают
sampleAnswer: Коммит фиксирует дерево файлов и причину. Ветка указывает на
  последний такой снимок. Merge стыкует две истории новым коммитом. Rebase
  заново прикладывает мои коммиты поверх другой базы, поэтому хеши другие. Если
  ветку уже забрали коллеги, я её не переписываю.
