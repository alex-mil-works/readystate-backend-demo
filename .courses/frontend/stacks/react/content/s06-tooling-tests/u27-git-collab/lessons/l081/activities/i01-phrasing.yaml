id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что такое remote, PR и честный конфликт?
rubric: |-
  Ожидаемые пункты:
  - origin и разница fetch/pull
  - PR до вливания в общую ветку
  - конфликт двух правок одного места
  - маркеры нельзя коммитить
sampleAnswer: Remote — другой клон истории. fetch его показывает, pull ещё и
  соединяет с моей веткой. PR нужен, чтобы diff посмотрели и прогнали проверки
  до main. Конфликт значит, что одну строку поменяли двое. Я убираю маркеры и
  оставляю поведение, которое правда нужно.
