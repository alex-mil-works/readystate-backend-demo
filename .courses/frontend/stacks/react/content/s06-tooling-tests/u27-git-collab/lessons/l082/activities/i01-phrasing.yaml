id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как восстановить коммит и как честно откатить уже отправленный?
rubric: |-
  Ожидаемые пункты:
  - reflog хранит прошлые положения ветки локально
  - reset двигает указатель
  - hard выбрасывает незакоммиченное
  - на общей истории используют revert
sampleAnswer: "Если коммит пропал только из ветки, я смотрю reflog и создаю
  ветку на старый хеш. Reset двигает указатель, hard ещё и стирает
  незакоммиченное. Уже отправленный коммит на main я отменяю через revert:
  история идёт вперёд, коллегам не нужен force-push."
