code: git reset --hard HEAD~1
question: Что произойдёт с незакоммиченными правками и с последним коммитом ветки?
choices:
  - id: a
    text: Ветка отступит на коммит назад, незакоммиченное в рабочей копии будет
      отброшено
    correct: true
  - id: b
    text: Появится revert-коммит, файлы не изменятся
  - id: c
    text: Удалится только сообщение, дерево останется
  - id: d
    text: Сработает только если есть конфликт
explain: hard опасен именно тем, что не оставляет правки в рабочей копии. На
  main так не откатывают опубликованное.
