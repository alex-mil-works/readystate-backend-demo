id: i01
kind: interview_phrasing
phase: phrasing
prompt: Зачем локфайл и чем опасна зависимость как код?
rubric: |-
  Ожидаемые пункты:
  - лок фиксирует дерево
  - CI не переписывает лок
  - пакет может выполнить скрипт установки
  - аудит не заменяет ревью
sampleAnswer: В манифесте диапазон, в локе точные версии. Его коммитят, а CI
  ставит только из него. Зависимость — чужой код, включая скрипт установки.
  Опечатка в имени и внезапный пост-инсталл опаснее, чем красный audit.
  Обновление я смотрю как маленький PR.
