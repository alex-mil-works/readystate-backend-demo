id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем опасны фантомные зависимости и почему в репозитории один пакетный менеджер?
rubric: |-
  Ожидаемые пункты:
  - hoist npm показывает чужие пакеты
  - pnpm изолирует граф
  - локфайлы разные
  - CI и автор вызывают один инструмент
sampleAnswer: npm может поднять зависимость соседа наверх, и импорт случайно
  заработает. На чистой установке его не будет. pnpm такого импорта не
  показывает. Лок у каждого менеджера свой, поэтому в репозитории один
  инструмент и его лок, и CI вызывает тот же бинарь.
