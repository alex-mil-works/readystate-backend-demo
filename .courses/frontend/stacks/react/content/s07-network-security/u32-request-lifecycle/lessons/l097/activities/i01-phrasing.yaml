id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что грузится на критическом пути и что можно кэшировать надолго?
rubric: |-
  Ожидаемые пункты:
  - HTML обнаруживает CSS и JS
  - блокирующий скрипт тормозит разбор
  - файл с хешем в имени неизменен
  - личный HTML не кладут в общий кэш
sampleAnswer: Сначала приходит документ, из него браузер узнаёт стили и скрипты.
  Скрипт в голове без async останавливает разбор. Файл сборки с хешем в имени
  можно кэшировать надолго, HTML входа — нет. Ответ с данными конкретного
  человека нельзя помечать как общий кэш.
