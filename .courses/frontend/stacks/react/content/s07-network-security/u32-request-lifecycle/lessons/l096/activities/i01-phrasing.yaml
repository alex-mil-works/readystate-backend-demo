id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что в HTTP-сообщении главное для фронтенда и чем GET отличается от POST?
rubric: |-
  Ожидаемые пункты:
  - метод, путь, заголовки, статус
  - 4xx и 5xx это ответы, не обрыв
  - GET не меняет состояние
  - повтор POST не безопасен сам по себе
sampleAnswer: "Запрос несёт метод и путь, ответ — статус и тело. Класс статуса
  важнее магии конкретной цифры: 404 значит «ответ есть, ресурса нет», а не
  «сеть умерла». GET можно повторять, он не должен ничего менять. Повторный POST
  может создать второе действие, если сервер сам это не запретил."
