id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что происходит между вводом хоста и первым байтом ответа?
rubric: |-
  Ожидаемые пункты:
  - URL разбирается, фрагмент не уходит
  - DNS даёт адрес
  - TCP открывает соединение
  - TLS проверяет сертификат имени
sampleAnswer: Браузер разбирает URL и не отправляет фрагмент после решётки. DNS
  переводит имя в адрес, TCP открывает соединение, TLS проверяет, что сертификат
  выдан этому имени и канал закрыт. Уже потом по каналу идёт HTTP.
