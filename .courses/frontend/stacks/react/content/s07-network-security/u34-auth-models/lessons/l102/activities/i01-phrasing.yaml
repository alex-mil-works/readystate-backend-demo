id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем JWT не является шифрованием и где его не стоит хранить?
rubric: |-
  Ожидаемые пункты:
  - утверждения читаемы, подпись мешает подмене
  - секретов в нагрузке нет
  - localStorage читает любой скрипт страницы
  - проверяет сервер, срок доступа короткий
sampleAnswer: "JWT подписан, но тело утверждений не секрет: пароль туда не
  кладут. Подпись проверяет сервер, фронтенд не становится охранником API.
  Короткий доступ ограничивает кражу. Класть его в localStorage опасно: скрипт
  страницы прочитает хранилище. Долгое обновление держат там, где скрипт его не
  видит."
