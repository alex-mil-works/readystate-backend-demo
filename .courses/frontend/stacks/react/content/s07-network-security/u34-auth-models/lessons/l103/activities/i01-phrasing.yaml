id: i01
kind: interview_phrasing
phase: phrasing
prompt: Какая роль у фронтенда во входе через OAuth и чего он не хранит?
rubric: |-
  Ожидаемые пункты:
  - начинает переход к провайдеру
  - не просит чужой пароль
  - не содержит секрет клиента
  - адрес возврата заранее известен, код из URL не логируют
sampleAnswer: "Фронтенд отправляет человека к провайдеру и принимает возврат.
  Пароль от того сервиса мы не собираем. Секрет приложения в бандле не живёт:
  браузерный клиент публичный. Адрес возврата должен совпасть с
  зарегистрированным, а код из адреса не отправляют в аналитику."
