id: i01
kind: interview_phrasing
phase: phrasing
prompt: Чем cookie-сессия удобна и какой риск у неё с чужого сайта?
rubric: |-
  Ожидаемые пункты:
  - браузер прикладывает cookie сам
  - HttpOnly прячет её от скрипта
  - чужой сайт может инициировать запрос с этой cookie
  - меняющее действие подтверждают отдельно, права живут на сервере
sampleAnswer: "Сессия в cookie удобна тем, что браузер сам прикладывает её к
  своему хосту, а HttpOnly не даёт скрипту её прочитать. Обратная сторона:
  запрос может начать чужая страница, и cookie уйдёт вместе с ним. Поэтому
  изменение данных подтверждают так, чтобы чужой сайт не смог это подтверждение
  прочитать. Роль человека хранит сервер, не сама cookie."
