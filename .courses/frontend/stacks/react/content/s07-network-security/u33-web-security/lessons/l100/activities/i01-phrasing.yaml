id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что защищает HTTPS и что он не решает за приложение?
rubric: |-
  Ожидаемые пункты:
  - шифрование и имя сервера
  - не права пользователя
  - не секрет внутри бандла
  - зависимость исполняется у клиента
sampleAnswer: "HTTPS закрывает дорогу и проверяет, что я говорю с нужным именем.
  Может ли этот человек удалить чужой урок, канал не знает. Ключ подписи я не
  кладу во фронтенд. Пакет из реестра стоит считать кодом поставки: он поедет в
  браузер вместе с моим."
