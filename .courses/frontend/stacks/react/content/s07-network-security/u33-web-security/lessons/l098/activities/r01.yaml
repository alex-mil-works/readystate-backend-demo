id: r01
kind: single_choice
phase: revision
prompt: Почему CORS на API не заменяет проверку «этот пользователь может удалить
  запись»?
options:
  - id: a
    text: Заголовок решает только чтение в браузере, не права на действие
    correct: true
  - id: b
    text: CORS шифрует тело
  - id: c
    text: С ним любой клиент перестаёт доходить до сервера
  - id: d
    text: Он заменяет пароль
explain: curl и чужой бэкенд заголовки CORS не соблюдают. Права проверяет сервер.
hints:
  - title: Предзапрос
    markdown: Непростой метод или свой заголовок браузер сначала спрашивает OPTIONS.
      Это не бизнес-логика.
