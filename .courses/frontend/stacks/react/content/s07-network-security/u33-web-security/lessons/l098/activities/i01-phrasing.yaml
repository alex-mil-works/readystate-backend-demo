id: i01
kind: interview_phrasing
phase: phrasing
prompt: Что такое источник и что на самом деле делает CORS?
rubric: |-
  Ожидаемые пункты:
  - схема, хост, порт
  - скрипт не читает чужой ответ сам
  - CORS разрешает чтение браузеру
  - это не проверка прав и не защита от не-браузера
sampleAnswer: "Источник — схема, хост и порт. Скрипт с другой страницы не читает
  мой ответ, пока сервер заголовком не разрешит это конкретному браузеру. Запрос
  при этом мог дойти. CORS не проверяет, имеет ли человек право на действие: это
  делает сервер для любого клиента."
