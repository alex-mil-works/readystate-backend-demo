id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как не пустить чужие данные в разметку и зачем тогда CSP?
rubric: |-
  Ожидаемые пункты:
  - текст вставляют как текст
  - сырой HTML исполняется в вашем источнике
  - CSP ограничивает источники скриптов
  - политика не заменяет экранирование
sampleAnswer: Имя и комментарий я показываю как текст узла, не собираю из них
  HTML. Иначе чужая разметка станет скриптом моей страницы и увидит то же, что
  мой код. CSP дополнительно запрещает неожиданные источники скриптов. Если
  строку уже вставили как HTML, политику всё равно надо считать запасным
  рубежом, а дыру закрыть.
