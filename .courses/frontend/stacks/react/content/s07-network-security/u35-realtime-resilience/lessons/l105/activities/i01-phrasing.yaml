id: i01
kind: interview_phrasing
phase: phrasing
prompt: Какие запросы можно повторять и как отменять устаревшие?
rubric: |-
  Ожидаемые пункты:
  - обрыв и 5xx, не 4xx про данные
  - пауза растёт и чуть случайна
  - POST повторяют с ключом идемпотентности
  - уход с экрана отменяет запрос
sampleAnswer: Повторять стоит обрыв и временную ошибку сервера, с растущей
  паузой и пределом попыток. Неверное поле повтор не исправит. Оплату без ключа
  идемпотентности я не шлю второй раз вслепую. Когда человек ушёл с экрана, я
  отменяю запрос, а не просто игнорирую поздний ответ.
