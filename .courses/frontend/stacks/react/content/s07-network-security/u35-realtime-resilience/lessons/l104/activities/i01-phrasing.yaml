id: i01
kind: interview_phrasing
phase: phrasing
prompt: Когда хватает событий сервера, а когда нужен WebSocket?
rubric: |-
  Ожидаемые пункты:
  - SSE односторонний и идёт по HTTP
  - сокет двусторонний, реконнект ваш
  - сохранение остаётся обычным запросом
  - редкие новости можно опрашивать
sampleAnswer: "Если говорит в основном сервер, я беру события по HTTP: браузер
  сам переподключится. Если обе стороны шлют часто, уместен сокет, и повтор
  соединения я проектирую сам. Кнопку сохранения я не уношу в сокет: у запроса
  есть статус и понятный повтор."
