id: i01
kind: interview_phrasing
phase: phrasing
prompt: Как развести 401, 403, 409 и обрыв сети в интерфейсе?
rubric: |-
  Ожидаемые пункты:
  - 401 ведёт ко входу
  - 403 не повторяют
  - 409 показывает актуальное состояние
  - обрыв и 5xx можно повторить
  - без стека и без одной плашки на всё
sampleAnswer: Если сессия кончилась, я прошу войти снова. Если прав нет, я так и
  пишу и не долблю запросом. Если запись уже изменилась, показываю текущую, а не
  затираю её. Если сети нет или сервер временно упал, предлагаю повторить.
  Внутренний стек человеку не нужен.
